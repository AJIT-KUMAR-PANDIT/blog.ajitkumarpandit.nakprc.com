fragment Publication on Publication {
	id
	title
	displayTitle
	url
	metaTags
	favicon
	isTeam
	followersCount
	descriptionSEO
	postsCount: posts(first: 0) {
		totalDocuments
	}
	author {
		name
		username
		profilePicture
		followersCount
		tagline
		bio {
			html
		}
		socialMediaLinks {
			twitter
			linkedin
			github
			website
		}
	}
	ogMetaData {
		image
	}
	preferences {
		logo
		darkMode {
			logo
		}
		navbarItems {
			id
			type
			label
			url
		}
	}
	links {
		twitter
		github
		linkedin
		hashnode
	}
	integrations {
		umamiWebsiteUUID
		gaTrackingID
		fbPixelID
		hotjarSiteID
		matomoURL
		matomoSiteID
		fathomSiteID
		fathomCustomDomain
		fathomCustomDomainEnabled
		plausibleAnalyticsEnabled
	}
}
